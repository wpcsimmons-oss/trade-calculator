# Refreshes the player data and publishes the website.
#
# Runs automatically every Tuesday and Thursday at 14:00 UTC, whenever code is
# pushed, and whenever you press the "Run workflow" button on the Actions tab.
#
# Safety: if the pipeline or any test fails, the job stops BEFORE the commit
# and deploy steps, so the last good version of the site stays live.
name: Refresh data and deploy site

on:
  schedule:
    - cron: "0 14 * * 2,4"      # Tue + Thu, 14:00 UTC
  workflow_dispatch:             # the manual "Run workflow" button
  push:
    paths:
      - "site/**"
      - "pipeline/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/refresh.yml"

permissions:
  contents: write     # to commit the refreshed players.json
  pages: write        # to publish the site
  id-token: write     # required by GitHub Pages deployments

concurrency:
  group: refresh-and-deploy
  cancel-in-progress: false

jobs:
  refresh:
    # Only the repository's main (default) branch publishes the site.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node (for the page's tests)
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Run the pipeline (download data, compute values, safety checks)
        run: python -m pipeline.build

      - name: Run the tests
        run: |
          python -m pytest -q
          node --test tests/*.test.js

      - name: Commit players.json only if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/players.json
          if git diff --cached --quiet; then
            echo "No change in players.json - nothing to commit."
          else
            git commit -m "Data refresh: $(date -u +%Y-%m-%d)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Prepare GitHub Pages
        uses: actions/configure-pages@v5

      - name: Package the site folder
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Publish to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
